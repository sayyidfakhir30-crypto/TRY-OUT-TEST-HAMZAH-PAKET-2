<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try Out 2 — Tes Hamzah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tambahan Library untuk cetak PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --paper:#f6f2e9; --paper-line:#e4dcc8; --ink:#2b2a25; --ink-soft:#6b6558;
    --accent:#0f5c56; --accent-soft:#e6efec;
    --correct-bg:#e7f3e2; --correct-border:#5c8a5c;
    --wrong-bg:#faeaea; --wrong-border:#a5473c;
    --selected-bg:#eaf1ff; --selected-border:#3b6fb0;
    --mudah:#5c8a5c; --sedang:#b8863b; --sulit:#a5473c;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; direction:ltr; }
  .screen{ display:none; min-height:100vh; }
  .screen.active{ display:block; }

  #login-screen.active{ display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:14px; padding:28px 26px; max-width:440px; width:100%; }
  .login-card h1{ font-size:19px; margin:0 0 4px; }
  .login-card .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }
  .maklumat{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:14px 16px; font-size:12.8px; line-height:1.7; color:var(--ink); margin-bottom:20px; }
  .maklumat b{ color:var(--accent); }
  .maklumat ol{ margin:8px 0 0; padding-inline-start:18px; }
  label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; }
  input[type=email], input[type=text]{ width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--paper-line); font-family:'Inter',sans-serif; font-size:14px; margin-bottom:14px; background:var(--paper); }
